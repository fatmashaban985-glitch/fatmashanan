<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تاج بسيط</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>تاج بسيط</h1>

    <svg class="crown" viewBox="0 0 400 270" role="img" aria-label="تاج ذهبي بسيط">
      <path class="top" d="M34 100 112 38 166 112 200 20 234 112 288 38 366 100 336 210H64Z"/>
      <path class="middle" d="M64 210h272l-12 38H76Z"/>
      <rect class="bottom" x="76" y="248" width="248" height="16" rx="8"/>
      <circle fill="#fff2ad" cx="200" cy="142" r="24"/>
    </svg>

    <div class="colors" aria-label="اختيار لون التاج">
      <button class="gold" type="button" data-color="gold" aria-label="ذهبي" aria-pressed="true"></button>
      <button class="silver" type="button" data-color="silver" aria-label="فضي" aria-pressed="false"></button>
      <button class="rose" type="button" data-color="rose" aria-label="وردي" aria-pressed="false"></button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
